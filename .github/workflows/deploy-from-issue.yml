name: deploy-from-issue
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
jobs:
  deploy:
    if: github.event.issue.user.login == 'd51youkun' && contains(github.event.issue.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply files from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os,re,base64
          body=os.environ['ISSUE_BODY']
          for m in re.finditer(r'```(files/[^\n`]+)\n(.*?)```', body, re.S):
              p,c=m.group(1).strip(),m.group(2).strip()
              if c.startswith('B64:'): c=base64.b64decode(c[4:]).decode()
              os.makedirs(os.path.dirname(p) or '.',exist_ok=True)
              open(p,'w').write(c)
              print('applied',p)
          PY
      - name: Commit and push
        run: |
          git config user.name "deploy-bot"
          git config user.email "action@users.noreply.github.com"
          git add -A
          git commit -m "deploy: from issue #${{ github.event.issue.number }}" || echo "nothing to commit"
          git push
