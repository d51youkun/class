<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>6年2組 提出チェック</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#222;--m:#777;--a:#3b82f6;--ok:#16a34a;--ng:#dc2626;--b:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#14161c;--c:#1e2129;--t:#eee;--m:#9aa;--b:#333}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--t)}
header{padding:14px 16px;font-weight:700;font-size:18px}
nav{display:flex;gap:6px;padding:0 12px}nav button{flex:1;padding:10px;border:0;border-radius:10px 10px 0 0;background:var(--b);color:var(--t);font-size:15px}
nav button.on{background:var(--a);color:#fff}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--c);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--b)}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.m{color:var(--m);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--b);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;margin-top:10px}
.list label{display:flex;gap:6px;align-items:center;padding:8px;border-radius:8px;border:1px solid var(--b);font-size:14px}
.list label.done{background:rgba(22,163,74,.12)}.list input{width:20px;height:20px}
input,button,select{font:inherit}input[type=text],input[type=password],input[type=date]{padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);width:100%}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--a);color:#fff}.btn.r{background:var(--ng)}.btn.g{background:var(--m)}
.ng{color:var(--ng);font-weight:700}.ok{color:var(--ok);font-weight:700}
</style></head><body>
<header>📚 6年2組 提出・持ち物チェック <span id="st" class="m"></span></header>
<nav><button data-t="hw">宿題</button><button data-t="bring">持ち物</button><button data-t="admin">連携 🔒</button></nav>
<main id="app"></main>
<script>
const R="明星 月子,安藤 駈,石井 晴翔,石田 るの,大内 龍斗,大河内 陽太,大鳥 新,岡田 瑠奈,小川 紗輝斗,片谷 美月,川名 挙信,菅野 悠乃,熊澤 夏芭,栗林 柚羽,小金 志穂,小髙 楓,小谷 蓮,鎮目 なつみ,菅田 そら,鈴木 叶乃,鈴木 孝明,鈴木 結菜,鈴木 悠太,関 茉柚莉,中村 真尋,中村 優乃,夏村 洋平,野倉 詩織,早川 譲治,三平 匡人,宮本 明莉,村田 優樹,八巻 凛奈,渡邉 駿一".split(","); // index+1 = 出席番号
let S={items:[]},tab="hw",PW=sessionStorage.pw||"",online=false,only=false,open={};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unlocked=()=>!!PW;
async function api(b){
  try{const r=await fetch("/api/x",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...b,pass:PW})});
    if(r.status===401)throw"pw"; if(r.status===502)throw"mail";if(r.status===500)throw"kv"; if(!r.ok)throw"net"; S=await r.json();online=true;
  }catch(e){if(e==="pw"||e==="mail"||e==="kv")throw e;online=false;throw"net"}
}
async function pull(){try{const r=await fetch("/api/x");if(!r.ok)throw 0;S=await r.json();online=true}catch{online=false}render()}
async function act(b){try{await api(b)}catch(e){alert(e==="pw"?"パスワードが違うよ":e==="kv"?"保存先(KV)が未設定だよ":e==="net"?"サーバーにつながらないよ":"メール送信に失敗(設定を確認)")}render()}
function notNames(it){return R.filter((_,i)=>!it.checks[i+1])}
async function autoNotify(){ // 連携ページを開いている間、期限を過ぎたら自動送信
  if(!unlocked())return;const today=new Date().toISOString().slice(0,10);
  for(const it of S.items)if(it.type==="hw"&&it.due&&it.due<today&&!it.notified&&notNames(it).length&&online)await act({op:"notify",id:it.id,names:notNames(it)});
}
function card(it){
  const done=Object.keys(it.checks).length,p=Math.round(done/R.length*100),un=notNames(it);
  const lbl=it.type==="hw"?["提出済","未提出"]:["持った","忘れ"];
  let h=`<div class="card"><div class="row" data-o="${it.id}" style="cursor:pointer"><div class="grow"><b>${esc(it.title)}</b>
   <div class="m">${it.assigned?"出た日 "+it.assigned+" ・ ":""}${it.due?"期限 "+it.due+" ・ ":""}${lbl[0]} ${done}/${R.length}${un.length?` ・ <span class="ng">${lbl[1]} ${un.length}人</span>`:` ・ <span class="ok">全員OK🎉</span>`}${it.notified?" ・ 📧送信済":""}</div></div><span>${open[it.id]?"▲":"▼"}</span></div>
   <div class="bar"><i style="width:${p}%"></i></div>`;
  if(open[it.id]){
    h+=`<div class="row" style="margin-top:8px"><label class="m"><input type="checkbox" id="only" ${only?"checked":""}> ${lbl[1]}だけ表示</label></div><div class="list">`;
    R.forEach((n,i)=>{const c=it.checks[i+1];if(only&&c)return;
      h+=`<label class="${c?"done":""}"><input type="checkbox" data-c="${it.id}|${i+1}" ${c?"checked":""} ${unlocked()?"":"disabled"}>${i+1}. ${n}</label>`});
    h+=`</div>${unlocked()?"":'<div class="m" style="margin-top:8px">🔒 チェックするには「連携」でロック解除してね</div>'}`;
    if(unlocked())h+=`<div class="row" style="margin-top:10px;gap:6px"><button class="btn" data-n="${it.id}" ${un.length?"":"disabled"}>📧 先生に${lbl[1]}者を送る</button><button class="btn r" data-d="${it.id}">削除</button></div>`;
  }
  return h+"</div>";
}
function render(){
  $("#st").textContent=online?"🟢 みんなと同期中":"🔴 未接続";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  let h="";
  if(tab==="admin"&&!unlocked())h=`<div class="card"><b>🔒 連携ページ</b><p class="m">パスワードを入れて ☑ を押してね</p><div class="row"><input type="password" id="pw" placeholder="パスワード"><button class="btn" id="go" style="font-size:20px">☑</button></div></div>`;
  else if(tab==="admin")h=`<div class="card"><b>➕ 新しく作る</b><div style="display:grid;gap:8px;margin-top:8px">
    <select id="ty"><option value="hw">宿題</option><option value="bring">持ち物</option></select>
    <input type="text" id="ti" placeholder="宿題の名前 / 持ち物の名前(例:漢字ドリル p.20)" maxlength="60">
    <input type="date" id="as" placeholder="出た日">
    <input type="date" id="du" placeholder="期限"><button class="btn" id="add">作成</button></div></div>
    <div class="card"><div class="m">期限を過ぎた宿題は、このページを開いている間に未提出者が先生へ自動送信されるよ。各項目の「📧」で手動送信もできる。</div>
    <button class="btn g" id="lock" style="margin-top:8px">🔒 ロックする</button></div>`+S.items.map(card).join("");
  else{const l=S.items.filter(x=>x.type===tab);h=l.length?l.map(card).join(""):'<div class="card m">まだ何もないよ。連携ページから作ってね。</div>'}
  $("#app").innerHTML=h;
}
document.addEventListener("click",async e=>{
  const t=e.target,d=t.dataset;
  if(d.t){tab=d.t;render();if(tab==="admin")autoNotify()}
  else if(d.o||t.closest("[data-o]")){const id=d.o||t.closest("[data-o]").dataset.o;open[id]=!open[id];render()}
  else if(t.id==="go"){PW=$("#pw").value;try{await api({op:"ping"});sessionStorage.pw=PW;render();autoNotify()}catch(e){PW="";alert(e==="kv"?"保存先(KV)が未設定だよ":e==="net"?"サーバーにつながらないよ":"パスワードが違うよ")}}
  else if(t.id==="lock"){PW="";sessionStorage.pw="";render()}
  else if(t.id==="add"){const ti=$("#ti").value.trim();if(!ti)return alert("名前を入れてね");await act({op:"add",type:$("#ty").value,title:ti,assigned:$("#as").value,due:$("#du").value});tab=$("#ty")?.value||tab}
  else if(d.d&&confirm("消していい?"))act({op:"del",id:d.d});
  else if(d.n){const it=S.items.find(x=>x.id===d.n);if(confirm(notNames(it).length+"人分を先生に送る?"))act({op:"notify",id:d.n,names:notNames(it)})}
  else if(t.id==="only"){only=t.checked;render()}
});
document.addEventListener("change",e=>{const c=e.target.dataset.c;if(c){const[id,no]=c.split("|");act({op:"check",id,no:+no,v:e.target.checked})}});
pull();setInterval(()=>{if(!document.hidden&&!document.activeElement?.matches("input[type=text],input[type=password]"))pull()},10000);
</script></body></html>
